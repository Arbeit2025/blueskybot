name: daily-post

# Check due slots every 10 minutes, away from the busy top of the hour.
# Slot times remain in config/post.json (JST). --due catches up to 2 hours
# of delay; a missed scheduler tick is retried by the next tick.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  # External hourly fallback: only the owner's edit of control issue #2.
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (all = preview, due = catch up recent slots)"
        type: choice
        default: all
        options:
          - all
          - due
          - extra_0000_recruit
          - extra_0015_promo
          - extra_0030_recruit
          - extra_0045_promo
          - recruit_night
          - extra_0115_promo
          - extra_0130_recruit
          - extra_0145_promo
          - extra_0200_recruit
          - extra_0215_promo
          - extra_0230_recruit
          - extra_0245_promo
          - extra_0300_recruit
          - extra_0315_promo
          - extra_0330_recruit
          - extra_0345_promo
          - extra_0400_recruit
          - extra_0415_promo
          - extra_0430_recruit
          - extra_0445_promo
          - extra_0500_recruit
          - extra_0515_promo
          - extra_0530_recruit
          - extra_0545_promo
          - extra_0600_recruit
          - extra_0615_promo
          - extra_0630_recruit
          - extra_0645_promo
          - extra_0700_recruit
          - extra_0715_promo
          - extra_0730_recruit
          - extra_0745_promo
          - greeting_morning
          - extra_0815_recruit
          - extra_0830_promo
          - extra_0845_recruit
          - recruit_morning
          - extra_0915_promo
          - extra_0930_recruit
          - extra_0945_promo
          - promo_morning
          - extra_1015_recruit
          - extra_1030_promo
          - extra_1045_recruit
          - extra_1100_promo
          - extra_1115_recruit
          - extra_1130_promo
          - extra_1145_recruit
          - greeting_noon
          - extra_1215_promo
          - extra_1230_recruit
          - extra_1245_promo
          - extra_1300_recruit
          - extra_1315_promo
          - extra_1330_recruit
          - extra_1345_promo
          - extra_1400_recruit
          - extra_1415_promo
          - extra_1430_recruit
          - extra_1445_promo
          - extra_1500_recruit
          - extra_1515_promo
          - extra_1530_recruit
          - extra_1545_promo
          - promo_afternoon
          - extra_1615_recruit
          - extra_1630_promo
          - extra_1645_recruit
          - extra_1700_promo
          - extra_1715_recruit
          - extra_1730_promo
          - extra_1745_recruit
          - extra_1800_promo
          - extra_1815_recruit
          - extra_1830_promo
          - extra_1845_recruit
          - greeting_evening
          - extra_1915_promo
          - extra_1930_recruit
          - extra_1945_promo
          - recruit_evening
          - extra_2015_promo
          - extra_2030_recruit
          - extra_2045_promo
          - extra_2100_recruit
          - extra_2115_promo
          - extra_2130_recruit
          - extra_2145_promo
          - greeting_night
          - extra_2215_recruit
          - extra_2230_promo
          - extra_2245_recruit
          - extra_2300_promo
          - extra_2315_recruit
          - extra_2330_promo
          - extra_2345_recruit
      dry_run:
        description: "Dry-run only (post nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: blueskybot-posting
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.number == 2 &&
       github.actor == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.state == 'open' &&
       github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post (or dry-run)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Kill switch: set the repository variable POST_ENABLED to
          # anything other than "true" (or delete it) to stop real posts.
          POST_ENABLED: ${{ vars.POST_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          BOT_REPORT_PATH: ${{ runner.temp }}/bot-report.json
        run: python -m bot.runner
      - name: Save execution outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bot-report.json
          retention-days: 7
