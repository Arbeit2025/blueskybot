name: daily-post

# Check due slots every 10 minutes, away from the busy top of the hour.
# Slot times remain in config/post.json (JST). --due catches up to 2 hours
# of delay; a missed scheduler tick is retried by the next tick.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (all = preview, due = catch up recent slots)"
        type: choice
        default: all
        options:
          - all
          - due
          - greeting_morning
          - greeting_noon
          - greeting_evening
          - promo_morning
          - promo_afternoon
          - recruit_morning
          - recruit_evening
          - recruit_night
          - greeting_night
      dry_run:
        description: "Dry-run only (post nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: blueskybot-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post (or dry-run)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Kill switch: set the repository variable POST_ENABLED to
          # anything other than "true" (or delete it) to stop real posts.
          POST_ENABLED: ${{ vars.POST_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            set -- --due
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_SLOT" in
              all) python -m bot.post_daily; exit 0 ;;
              due) set -- --due ;;
              *) set -- --slot "$INPUT_SLOT" ;;
            esac
          else
            echo "unsupported event: $EVENT_NAME"
            exit 1
          fi
          if [ "$POST_ENABLED" = "true" ] && {
            [ "$EVENT_NAME" = "schedule" ] || [ "$INPUT_DRY_RUN" = "false" ];
          }; then
            set -- "$@" --post
          fi
          python -m bot.post_daily "$@"
