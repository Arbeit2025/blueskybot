name: daily-post

# Check due slots every 10 minutes, away from the busy top of the hour.
# Slot times remain in config/post.json (JST). --due catches up to 2 hours
# of delay; a missed scheduler tick is retried by the next tick.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  # External hourly fallback: only the owner's edit of control issue #2.
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (all = preview, due = catch up recent slots)"
        type: choice
        default: all
        options:
          - all
          - due
          - greeting_morning
          - greeting_noon
          - greeting_evening
          - promo_morning
          - promo_afternoon
          - recruit_morning
          - recruit_evening
          - recruit_night
          - greeting_night
      dry_run:
        description: "Dry-run only (post nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: blueskybot-posting
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.number == 2 &&
       github.actor == github.repository_owner &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.issue.state == 'open' &&
       github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post (or dry-run)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Kill switch: set the repository variable POST_ENABLED to
          # anything other than "true" (or delete it) to stop real posts.
          POST_ENABLED: ${{ vars.POST_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          BOT_REPORT_PATH: ${{ runner.temp }}/bot-report.json
        run: python -m bot.runner
      - name: Save execution outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bot-report.json
          retention-days: 7
